<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TournamentX — Sports Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <span class="logo-icon">⚡</span>
      <span class="logo-text">TournamentX</span>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-page="dashboard">
        <span class="nav-icon">◈</span> Dashboard
      </button>
      <button class="nav-item" data-page="tournaments">
        <span class="nav-icon">◉</span> Tournaments
      </button>
      <button class="nav-item" data-page="matches">
        <span class="nav-icon">◎</span> Matches
      </button>
      <button class="nav-item" data-page="standings">
        <span class="nav-icon">◇</span> Standings
      </button>
    </nav>
    <div class="sidebar-footer">
      <div class="live-indicator"><span></span>Live Updates</div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title" id="pageTitle">Dashboard</h1>
        <span class="page-sub" id="pageSub">Overview of all tournaments</span>
      </div>
      <div class="topbar-right">
        <button class="btn-primary" id="addBtn">+ New Tournament</button>
      </div>
    </header>

    <!-- DASHBOARD PAGE -->
    <section id="page-dashboard" class="page active">
      <div class="stats-row" id="statsRow"></div>
      <div class="dash-grid">
        <div class="card">
          <div class="card-head"><h2>Active Tournaments</h2></div>
          <div id="activeTournamentsList"></div>
        </div>
        <div class="card">
          <div class="card-head"><h2>Recent Matches</h2></div>
          <div id="recentMatchesList"></div>
        </div>
      </div>
    </section>

    <!-- TOURNAMENTS PAGE -->
    <section id="page-tournaments" class="page">
      <div id="tournamentCards" class="tournament-grid"></div>
    </section>

    <!-- MATCHES PAGE -->
    <section id="page-matches" class="page">
      <div class="filter-bar">
        <select id="matchTournamentFilter" class="select-input">
          <option value="">All Tournaments</option>
        </select>
        <select id="matchStatusFilter" class="select-input">
          <option value="">All Status</option>
          <option value="upcoming">Upcoming</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <div id="matchesList"></div>
    </section>

    <!-- STANDINGS PAGE -->
    <section id="page-standings" class="page">
      <div class="filter-bar">
        <select id="standingsTournamentFilter" class="select-input">
          <option value="">Select Tournament</option>
        </select>
      </div>
      <div id="standingsTable"></div>
    </section>
  </main>

  <!-- MODALS -->
  <div class="modal-overlay" id="modalOverlay">
    <!-- Add Tournament Modal -->
    <div class="modal" id="addTournamentModal">
      <div class="modal-head">
        <h2>New Tournament</h2>
        <button class="modal-close" id="closeAddModal">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Tournament Name</label>
          <input type="text" id="tName" class="text-input" placeholder="e.g. World Cup 2026" />
        </div>
        <div class="form-group">
          <label>Sport</label>
          <select id="tSport" class="select-input">
            <option value="Football">Football</option>
            <option value="Basketball">Basketball</option>
            <option value="Cricket">Cricket</option>
            <option value="Tennis">Tennis</option>
            <option value="Volleyball">Volleyball</option>
            <option value="Hockey">Hockey</option>
          </select>
        </div>
        <div class="form-group">
          <label>Teams (comma separated)</label>
          <input type="text" id="tTeams" class="text-input" placeholder="Team A, Team B, Team C" />
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn-ghost" id="cancelAddModal">Cancel</button>
        <button class="btn-primary" id="saveTournament">Create Tournament</button>
      </div>
    </div>

    <!-- Add Match Modal -->
    <div class="modal" id="addMatchModal" style="display:none">
      <div class="modal-head">
        <h2>Add Match</h2>
        <button class="modal-close" id="closeMatchModal">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="matchTournamentId" />
        <div class="form-group">
          <label>Team 1</label>
          <select id="matchTeam1" class="select-input"></select>
        </div>
        <div class="form-group">
          <label>Team 2</label>
          <select id="matchTeam2" class="select-input"></select>
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="matchDate" class="text-input" />
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn-ghost" id="cancelMatchModal">Cancel</button>
        <button class="btn-primary" id="saveMatch">Add Match</button>
      </div>
    </div>

    <!-- Update Score Modal -->
    <div class="modal" id="updateScoreModal" style="display:none">
      <div class="modal-head">
        <h2>Update Score</h2>
        <button class="modal-close" id="closeScoreModal">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="scoreMatchId" />
        <input type="hidden" id="scoreTournamentId" />
        <div class="score-inputs">
          <div class="form-group">
            <label id="scoreLabel1">Team 1</label>
            <input type="number" id="score1" class="text-input score-num" min="0" value="0" />
          </div>
          <div class="vs-label">VS</div>
          <div class="form-group">
            <label id="scoreLabel2">Team 2</label>
            <input type="number" id="score2" class="text-input score-num" min="0" value="0" />
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn-ghost" id="cancelScoreModal">Cancel</button>
        <button class="btn-primary" id="saveScore">Save Score</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
